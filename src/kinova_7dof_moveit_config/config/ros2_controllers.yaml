# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # The Gen3 low-level cyclic interface is designed for a 1 kHz command
    # stream. A slower loop can trip the robot watchdog and make a resumed
    # trajectory jump to a later setpoint after a missed UDP exchange.
    update_rate: 1000 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Publishing and action monitoring do not need to run at the 1 kHz
    # hardware-loop rate.
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

twist_controller:
  ros__parameters:
    joints:
      - tcp

fault_controller:
  ros__parameters:
    joints: []
