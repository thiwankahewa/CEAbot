/plant_view_scanner:
  ros__parameters:
    acceleration_scaling: 0.1
    bench_height: 0.75 # Bench surface above world ground, metres.
    circle_height_offset: 0.12
    circle_radius_offset: 0.05
    # Side views aim halfway between the pot rim and detected plant top.
    look_at_angle_offset: 0.0 # Legacy parameter; no longer used for aiming.
    optimize_view_order: true
    optimizer_plant_batch_size: 3
    orientation_tolerance: 0.01
    planning_time: 2.0
    position_tolerance: 0.01
    pot_height: 0.15 # Pot rim above bench surface, metres.
    use_sim_time: false
    velocity_scaling: 0.4
    view_count: 7
    z_offset: 0.25
